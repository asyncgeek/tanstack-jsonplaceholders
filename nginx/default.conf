server {
  listen       80;
  server_name  _;
  root /usr/share/nginx/html;
  index index.html;

  # Serve files if they exist, otherwise return index.html (SPA fallback)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: static asset handling
  location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|json|map)$ {
    try_files $uri =404;
    expires max;
    access_log off;
  }

  gzip on;
}
